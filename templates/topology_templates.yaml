    groups:
    - name: Templates/Network devices
    items:
    - uuid: 2bb2062e9fa745fe8418b461efea8fde
      name: 'ARP: Table walk'
      type: SNMP_AGENT
      snmp_oid: 'walk[{$TOPO.ARP.OID}]'
      key: topo.arp.walk
      delay: '{$TOPO.ARP.INTERVAL}'
      history: '0'
      value_type: TEXT
      trends: '0'
      description: 'IPv4 ARP table, one column only. Not stored.'
      tags:
      - tag: component
        value: topology
      timeout: '{$TOPO.WALK.TIMEOUT}'
    - uuid: b084f60dba834d8e8b30e107a3aff46a
      name: 'ARP: IP to MAC'
      type: DEPENDENT
      key: topo.arp
      delay: '0'
      history: '{$TOPO.ARP.HISTORY}'
      value_type: TEXT
      description: 'IPv4 to MAC map filtered by {$TOPO.ARP.NET.MATCH}.'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          // ---- shared walk helpers (ES5 / Duktape) ----
          function tmParse(text) {
              var lines = String(text).split(/\r?\n/), out = [], cur = null, i, m, v;
              var re = /^\.?((?:\d+\.)+\d+)\s*=\s*(?:([A-Za-z0-9\-]+):\s*)?(.*)$/;
              for (i = 0; i < lines.length; i++) {
                  m = re.exec(lines[i]);
                  if (m) {
                      cur = {oid: m[1], type: m[2] || '', val: m[3]};
                      out.push(cur);
                  }
                  else if (cur && lines[i] !== '') {
                      cur.val += (cur.type === 'Hex-STRING' ? ' ' : '\n') + lines[i];
                  }
              }
              var res = [];
              for (i = 0; i < out.length; i++) {
                  v = out[i].val;
                  if (/^No (Such|more)/.test(v) || /^No Such/.test(out[i].type)) continue;
                  if (v.length >= 2 && v.charAt(0) === '"' && v.charAt(v.length - 1) === '"') {
                      v = v.substring(1, v.length - 1).replace(/\\(["\\])/g, '$1');
                  }
                  out[i].val = v;
                  res.push(out[i]);
              }
              return res;
          }
          function tmSuffix(oid, prefix) {
              if (oid.indexOf(prefix + '.') !== 0) return null;
              return oid.substring(prefix.length + 1);
          }
          function tmInt(v) {
              var m = /\((-?\d+)\)/.exec(v) || /-?\d+/.exec(v);
              return m ? parseInt(m[1] !== undefined ? m[1] : m[0], 10) : null;
          }
          function tmBytes(e) {
              var b = [], i, s = e.val;
              if (e.type === 'Hex-STRING') {
                  s = s.replace(/[^0-9A-Fa-f]/g, '');
                  for (i = 0; i + 1 < s.length; i += 2) b.push(parseInt(s.substr(i, 2), 16));
                  return b;
              }
              // A server or proxy that has MIB files loaded prints binary values the way the MIB's
              // display hint says, as text: a MAC arrives as STRING "00:1a:2b:3c:4d:5e" (or unpadded,
              // "0:50:56:1:2:3") where a server without MIBs gives Hex-STRING. Same bytes either way.
              if (/^[0-9A-Fa-f]{1,2}([:\- ][0-9A-Fa-f]{1,2})+$/.test(s)) {
                  var parts = s.split(/[:\- ]/);
                  for (i = 0; i < parts.length; i++) b.push(parseInt(parts[i], 16));
                  return b;
              }
              for (i = 0; i < s.length; i++) b.push(s.charCodeAt(i) & 0xff);
              return b;
          }
          function tmHex(b) {
              var s = '', i, h;
              for (i = 0; i < b.length; i++) { h = b[i].toString(16); s += (h.length < 2 ? '0' : '') + h; }
              return s;
          }
          function tmPrintable(b) {
              for (var i = 0; i < b.length; i++) { if (b[i] < 32 || b[i] > 126) return false; }
              return b.length > 0;
          }
          function tmText(e) {
              var b = tmBytes(e);
              if (e.type !== 'Hex-STRING') return e.val;
              while (b.length && b[b.length - 1] === 0) b.pop();
              if (tmPrintable(b)) { var s = ''; for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return s; }
              return tmHex(b);
          }
          // LLDP chassis/port id decode. kind 'c' chassis (mac=4, net=5) / 'p' port (mac=3, net=4)
          function tmLldpId(e, subtype, kind) {
              var b = tmBytes(e);
              var macSt = kind === 'c' ? 4 : 3, netSt = kind === 'c' ? 5 : 4;
              if (subtype === macSt && b.length === 6) return tmHex(b);
              if (subtype === netSt && b.length === 5 && b[0] === 1) return b[1] + '.' + b[2] + '.' + b[3] + '.' + b[4];
              if (e.type === 'Hex-STRING' && b.length === 6 && !tmPrintable(b)) return tmHex(b);
              return tmText(e);
          }
          function tmMacFromIdx(parts) {
              if (parts.length < 6) return null;
              var p = parts.slice(parts.length - 6), s = '', i, h;
              for (i = 0; i < 6; i++) { h = parseInt(p[i], 10).toString(16); s += (h.length < 2 ? '0' : '') + h; }
              return s;
          }
          function tmMacro(v, def) {
              var n = parseInt(v, 10);
              return isNaN(n) ? def : n;
          }
          function tmKeys(o) { var k = []; for (var x in o) if (o.hasOwnProperty(x)) k.push(x); return k; }
          function tmNumSort(a, b) { return (parseInt(a, 10) - parseInt(b, 10)) || (a < b ? -1 : a > b ? 1 : 0); }
          // ---- end helpers ----

          // Input: walk of ipNetToMediaPhysAddress or ipNetToPhysicalPhysAddress. IPv4 only.
          // Output: {ip: mac} sorted, filtered by {$TOPO.ARP.NET.MATCH}, capped by {$TOPO.VALUE.MAX.BYTES}.
          var MATCH = '{$TOPO.ARP.NET.MATCH}';
          var MAX_BYTES = tmMacro('{$TOPO.VALUE.MAX.BYTES}', 60000);
          var re = null;
          if (MATCH.charAt(0) !== '{' && MATCH !== '') { try { re = new RegExp(MATCH); } catch (e) { re = null; } }
          var M1 = '1.3.6.1.2.1.4.22.1.2', M2 = '1.3.6.1.2.1.4.35.1.4';
          var rows = tmParse(value), out = {}, r, s, i, p, ip, b;
          for (i = 0; i < rows.length; i++) {
              r = rows[i];
              ip = null;
              if ((s = tmSuffix(r.oid, M1)) !== null) {
                  p = s.split('.');
                  if (p.length === 5) ip = p.slice(1).join('.');
              }
              else if ((s = tmSuffix(r.oid, M2)) !== null) {
                  p = s.split('.');
                  if (p.length === 7 && p[1] === '1' && p[2] === '4') ip = p.slice(3).join('.');
              }
              if (!ip || (re && !re.test(ip))) continue;
              b = tmBytes(r);
              if (b.length !== 6) continue;
              var mac = tmHex(b);
              if (mac === '000000000000' || mac === 'ffffffffffff') continue;
              out[ip] = mac;
          }
          function ipNum(a) { var q = a.split('.'); return ((+q[0]) * 16777216) + ((+q[1]) << 16) + ((+q[2]) << 8) + (+q[3]); }
          var k = tmKeys(out).sort(function (a, c) { return ipNum(a) - ipNum(c); }), res = {}, len = 2;
          for (i = 0; i < k.length; i++) {
              len += k[i].length + 20;
              if (len > MAX_BYTES) { res['_truncated'] = String(k.length - i); break; }
              res[k[i]] = out[k[i]];
          }
          return JSON.stringify(res);
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - '{$TOPO.HEARTBEAT}'
      master_item:
        key: topo.arp.walk
      tags:
      - tag: component
        value: topology
      trends: '0'
    tags:
    - tag: class
      value: network
    - tag: target
      value: topology
    macros:
    - macro: '{$TOPO.HEARTBEAT}'
      value: 12h
      description: 'Unchanged topology values are stored at most this often. Keep it below Administration > General > GUI > "Max history display period" or the map loses data.'
    - macro: '{$TOPO.HISTORY}'
      value: 14d
      description: History retention for topology text items. Only changes plus heartbeats are stored.
    - macro: '{$TOPO.WALK.TIMEOUT}'
      value: 15s
      description: Per-item timeout for topology walks.
    - macro: '{$TOPO.VALUE.MAX.BYTES}'
      value: '60000'
      description: Hard cap on stored JSON size per value.
    - macro: '{$TOPO.ARP.INTERVAL}'
      value: 30m
      description: ARP poll interval.
    - macro: '{$TOPO.ARP.HISTORY}'
      value: 3d
      description: History for the ARP map.
    - macro: '{$TOPO.ARP.OID}'
      value: 1.3.6.1.2.1.4.22.1.2
      description: ipNetToMediaPhysAddress. Use 1.3.6.1.2.1.4.35.1.4 (ipNetToPhysicalPhysAddress) where the old table is missing.
    - macro: '{$TOPO.ARP.NET.MATCH}'
      value: ''
      description: 'Optional regex on IPv4 addresses to keep, e.g. ^10[.](20|21)[.] (use [.] rather than backslashes). Empty keeps all, subject to the size cap.'
