zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: 98234b0948dc47fea192a7a806e787ea
    name: Templates/Network devices
  templates:
  - uuid: 022c033275a84bda91f3a0a25fac7a2f
    template: Topology by SNMP
    name: Topology by SNMP
    description: 'Topology collection for the Topology frontend module: LLDP, port names and the forwarding database, polled with one small walk[] request per table (hourly for neighbors, every few hours for the rest) and stored only on change.


      Link "Topology CDP by SNMP" to Cisco devices and "Topology ARP by SNMP" to layer 3 gateways.'
    groups:
    - name: Templates/Network devices
    items:
    - uuid: dc1a7dfa5e23406599de47c01da8e071
      name: 'LLDP: Local system walk'
      type: SNMP_AGENT
      snmp_oid: 'walk[1.0.8802.1.1.2.1.3]'
      key: topo.lldp.local.walk
      delay: '{$TOPO.LLDP.LOCAL.INTERVAL}'
      history: '0'
      value_type: TEXT
      trends: '0'
      description: 'LLDP-MIB lldpLocalSystemData, walked as one subtree. A single OID per request is the shape every agent answers; wide multi-column requests are dropped by some (MikroTik, small-business switches). Not stored.'
      tags:
      - tag: component
        value: topology
      timeout: '{$TOPO.WALK.TIMEOUT}'
    - uuid: 0775389733b8466fb5245709c73c70f6
      name: 'LLDP: Local system'
      type: DEPENDENT
      key: topo.lldp.local
      delay: '0'
      history: '{$TOPO.HISTORY}'
      value_type: TEXT
      description: 'Own chassis ID, system name and LLDP port numbers. Used by the Topology module to recognise this device in neighbor tables.'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          // ---- shared walk helpers (ES5 / Duktape) ----
          function tmParse(text) {
              var lines = String(text).split(/\r?\n/), out = [], cur = null, i, m, v;
              var re = /^\.?((?:\d+\.)+\d+)\s*=\s*(?:([A-Za-z0-9\-]+):\s*)?(.*)$/;
              for (i = 0; i < lines.length; i++) {
                  m = re.exec(lines[i]);
                  if (m) {
                      cur = {oid: m[1], type: m[2] || '', val: m[3]};
                      out.push(cur);
                  }
                  else if (cur && lines[i] !== '') {
                      cur.val += (cur.type === 'Hex-STRING' ? ' ' : '\n') + lines[i];
                  }
              }
              var res = [];
              for (i = 0; i < out.length; i++) {
                  v = out[i].val;
                  if (/^No (Such|more)/.test(v) || /^No Such/.test(out[i].type)) continue;
                  if (v.length >= 2 && v.charAt(0) === '"' && v.charAt(v.length - 1) === '"') {
                      v = v.substring(1, v.length - 1).replace(/\\(["\\])/g, '$1');
                  }
                  out[i].val = v;
                  res.push(out[i]);
              }
              return res;
          }
          function tmSuffix(oid, prefix) {
              if (oid.indexOf(prefix + '.') !== 0) return null;
              return oid.substring(prefix.length + 1);
          }
          function tmInt(v) {
              var m = /\((-?\d+)\)/.exec(v) || /-?\d+/.exec(v);
              return m ? parseInt(m[1] !== undefined ? m[1] : m[0], 10) : null;
          }
          function tmBytes(e) {
              var b = [], i, s = e.val;
              if (e.type === 'Hex-STRING') {
                  s = s.replace(/[^0-9A-Fa-f]/g, '');
                  for (i = 0; i + 1 < s.length; i += 2) b.push(parseInt(s.substr(i, 2), 16));
                  return b;
              }
              // A server or proxy that has MIB files loaded prints binary values the way the MIB's
              // display hint says, as text: a MAC arrives as STRING "00:1a:2b:3c:4d:5e" (or unpadded,
              // "0:50:56:1:2:3") where a server without MIBs gives Hex-STRING. Same bytes either way.
              if (/^[0-9A-Fa-f]{1,2}([:\- ][0-9A-Fa-f]{1,2})+$/.test(s)) {
                  var parts = s.split(/[:\- ]/);
                  for (i = 0; i < parts.length; i++) b.push(parseInt(parts[i], 16));
                  return b;
              }
              for (i = 0; i < s.length; i++) b.push(s.charCodeAt(i) & 0xff);
              return b;
          }
          function tmHex(b) {
              var s = '', i, h;
              for (i = 0; i < b.length; i++) { h = b[i].toString(16); s += (h.length < 2 ? '0' : '') + h; }
              return s;
          }
          function tmPrintable(b) {
              for (var i = 0; i < b.length; i++) { if (b[i] < 32 || b[i] > 126) return false; }
              return b.length > 0;
          }
          function tmText(e) {
              var b = tmBytes(e);
              if (e.type !== 'Hex-STRING') return e.val;
              while (b.length && b[b.length - 1] === 0) b.pop();
              if (tmPrintable(b)) { var s = ''; for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return s; }
              return tmHex(b);
          }
          // LLDP chassis/port id decode. kind 'c' chassis (mac=4, net=5) / 'p' port (mac=3, net=4)
          function tmLldpId(e, subtype, kind) {
              var b = tmBytes(e);
              var macSt = kind === 'c' ? 4 : 3, netSt = kind === 'c' ? 5 : 4;
              if (subtype === macSt && b.length === 6) return tmHex(b);
              if (subtype === netSt && b.length === 5 && b[0] === 1) return b[1] + '.' + b[2] + '.' + b[3] + '.' + b[4];
              if (e.type === 'Hex-STRING' && b.length === 6 && !tmPrintable(b)) return tmHex(b);
              return tmText(e);
          }
          function tmMacFromIdx(parts) {
              if (parts.length < 6) return null;
              var p = parts.slice(parts.length - 6), s = '', i, h;
              for (i = 0; i < 6; i++) { h = parseInt(p[i], 10).toString(16); s += (h.length < 2 ? '0' : '') + h; }
              return s;
          }
          function tmMacro(v, def) {
              var n = parseInt(v, 10);
              return isNaN(n) ? def : n;
          }
          function tmKeys(o) { var k = []; for (var x in o) if (o.hasOwnProperty(x)) k.push(x); return k; }
          function tmNumSort(a, b) { return (parseInt(a, 10) - parseInt(b, 10)) || (a < b ? -1 : a > b ? 1 : 0); }
          // ---- end helpers ----

          var B = '1.0.8802.1.1.2.1.3';
          var rows = tmParse(value), r, s, i, parts, out = {cst: null, cid: '', sys: '', p: {}}, cidE = null, pst = {}, pidE = {};
          for (i = 0; i < rows.length; i++) {
              r = rows[i];
              if ((s = tmSuffix(r.oid, B + '.1')) !== null) out.cst = tmInt(r.val);
              else if ((s = tmSuffix(r.oid, B + '.2')) !== null) cidE = r;
              else if ((s = tmSuffix(r.oid, B + '.3')) !== null) out.sys = r.val;
              else if ((s = tmSuffix(r.oid, B + '.7.1.2')) !== null) pst[s] = tmInt(r.val);
              else if ((s = tmSuffix(r.oid, B + '.7.1.3')) !== null) pidE[s] = r;
              else if ((s = tmSuffix(r.oid, B + '.7.1.4')) !== null) { out.p[s] = out.p[s] || {}; out.p[s].d = r.val; }
          }
          if (cidE) out.cid = tmLldpId(cidE, out.cst, 'c');
          for (s in pidE) {
              if (!pidE.hasOwnProperty(s)) continue;
              out.p[s] = out.p[s] || {};
              out.p[s].id = tmLldpId(pidE[s], pst[s], 'p');
          }
          var ports = {}, k = tmKeys(out.p).sort(tmNumSort);
          for (i = 0; i < k.length; i++) ports[k[i]] = out.p[k[i]];
          out.p = ports;
          return JSON.stringify(out);
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - '{$TOPO.HEARTBEAT}'
      master_item:
        key: topo.lldp.local.walk
      tags:
      - tag: component
        value: topology
      trends: '0'
    - uuid: ddc5ca36630844bc8502241d36fb8e79
      name: 'LLDP: Remote table walk'
      type: SNMP_AGENT
      snmp_oid: 'walk[1.0.8802.1.1.2.1.4]'
      key: topo.lldp.remote.walk
      delay: '{$TOPO.LLDP.INTERVAL}'
      history: '0'
      value_type: TEXT
      trends: '0'
      description: 'LLDP-MIB lldpRemoteSystemsData, walked as one subtree (see the local walk for why). Only the columns the map needs are kept when parsed; sysDesc is cut to 48 characters. Not stored.'
      tags:
      - tag: component
        value: topology
      timeout: '{$TOPO.WALK.TIMEOUT}'
    - uuid: 97a01c4100d746249b4272a49127ef64
      name: 'LLDP: Neighbors'
      type: DEPENDENT
      key: topo.lldp.neighbors
      delay: '0'
      history: '{$TOPO.HISTORY}'
      value_type: TEXT
      description: Normalised LLDP neighbor list. Stored only on change plus heartbeat.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          // ---- shared walk helpers (ES5 / Duktape) ----
          function tmParse(text) {
              var lines = String(text).split(/\r?\n/), out = [], cur = null, i, m, v;
              var re = /^\.?((?:\d+\.)+\d+)\s*=\s*(?:([A-Za-z0-9\-]+):\s*)?(.*)$/;
              for (i = 0; i < lines.length; i++) {
                  m = re.exec(lines[i]);
                  if (m) {
                      cur = {oid: m[1], type: m[2] || '', val: m[3]};
                      out.push(cur);
                  }
                  else if (cur && lines[i] !== '') {
                      cur.val += (cur.type === 'Hex-STRING' ? ' ' : '\n') + lines[i];
                  }
              }
              var res = [];
              for (i = 0; i < out.length; i++) {
                  v = out[i].val;
                  if (/^No (Such|more)/.test(v) || /^No Such/.test(out[i].type)) continue;
                  if (v.length >= 2 && v.charAt(0) === '"' && v.charAt(v.length - 1) === '"') {
                      v = v.substring(1, v.length - 1).replace(/\\(["\\])/g, '$1');
                  }
                  out[i].val = v;
                  res.push(out[i]);
              }
              return res;
          }
          function tmSuffix(oid, prefix) {
              if (oid.indexOf(prefix + '.') !== 0) return null;
              return oid.substring(prefix.length + 1);
          }
          function tmInt(v) {
              var m = /\((-?\d+)\)/.exec(v) || /-?\d+/.exec(v);
              return m ? parseInt(m[1] !== undefined ? m[1] : m[0], 10) : null;
          }
          function tmBytes(e) {
              var b = [], i, s = e.val;
              if (e.type === 'Hex-STRING') {
                  s = s.replace(/[^0-9A-Fa-f]/g, '');
                  for (i = 0; i + 1 < s.length; i += 2) b.push(parseInt(s.substr(i, 2), 16));
                  return b;
              }
              // A server or proxy that has MIB files loaded prints binary values the way the MIB's
              // display hint says, as text: a MAC arrives as STRING "00:1a:2b:3c:4d:5e" (or unpadded,
              // "0:50:56:1:2:3") where a server without MIBs gives Hex-STRING. Same bytes either way.
              if (/^[0-9A-Fa-f]{1,2}([:\- ][0-9A-Fa-f]{1,2})+$/.test(s)) {
                  var parts = s.split(/[:\- ]/);
                  for (i = 0; i < parts.length; i++) b.push(parseInt(parts[i], 16));
                  return b;
              }
              for (i = 0; i < s.length; i++) b.push(s.charCodeAt(i) & 0xff);
              return b;
          }
          function tmHex(b) {
              var s = '', i, h;
              for (i = 0; i < b.length; i++) { h = b[i].toString(16); s += (h.length < 2 ? '0' : '') + h; }
              return s;
          }
          function tmPrintable(b) {
              for (var i = 0; i < b.length; i++) { if (b[i] < 32 || b[i] > 126) return false; }
              return b.length > 0;
          }
          function tmText(e) {
              var b = tmBytes(e);
              if (e.type !== 'Hex-STRING') return e.val;
              while (b.length && b[b.length - 1] === 0) b.pop();
              if (tmPrintable(b)) { var s = ''; for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return s; }
              return tmHex(b);
          }
          // LLDP chassis/port id decode. kind 'c' chassis (mac=4, net=5) / 'p' port (mac=3, net=4)
          function tmLldpId(e, subtype, kind) {
              var b = tmBytes(e);
              var macSt = kind === 'c' ? 4 : 3, netSt = kind === 'c' ? 5 : 4;
              if (subtype === macSt && b.length === 6) return tmHex(b);
              if (subtype === netSt && b.length === 5 && b[0] === 1) return b[1] + '.' + b[2] + '.' + b[3] + '.' + b[4];
              if (e.type === 'Hex-STRING' && b.length === 6 && !tmPrintable(b)) return tmHex(b);
              return tmText(e);
          }
          function tmMacFromIdx(parts) {
              if (parts.length < 6) return null;
              var p = parts.slice(parts.length - 6), s = '', i, h;
              for (i = 0; i < 6; i++) { h = parseInt(p[i], 10).toString(16); s += (h.length < 2 ? '0' : '') + h; }
              return s;
          }
          function tmMacro(v, def) {
              var n = parseInt(v, 10);
              return isNaN(n) ? def : n;
          }
          function tmKeys(o) { var k = []; for (var x in o) if (o.hasOwnProperty(x)) k.push(x); return k; }
          function tmNumSort(a, b) { return (parseInt(a, 10) - parseInt(b, 10)) || (a < b ? -1 : a > b ? 1 : 0); }
          // ---- end helpers ----

          var R = '1.0.8802.1.1.2.1.4.1.1', M = '1.0.8802.1.1.2.1.4.2.1.3';
          var rows = tmParse(value), nb = {}, r, s, i, parts, key, col, n;
          function get(k) { if (!nb[k]) nb[k] = {lp: k.split('.')[0]}; return nb[k]; }
          for (i = 0; i < rows.length; i++) {
              r = rows[i];
              if ((s = tmSuffix(r.oid, M)) !== null) {
                  parts = s.split('.');
                  if (parts.length < 7) continue;
                  key = parts[1] + '.' + parts[2];
                  var a = parts.slice(3);
                  if (a[0] === '1' && a[1] === '4' && a.length >= 6) a = a.slice(2, 6);
                  else if (a[0] === '1' && a.length === 5) a = a.slice(1, 5);
                  else continue;
                  n = get(key);
                  n.ip = n.ip || a.join('.');
                  continue;
              }
              if ((s = tmSuffix(r.oid, R)) === null) continue;
              parts = s.split('.');
              if (parts.length < 4) continue;
              col = parts[0];
              key = parts[2] + '.' + parts[3];
              n = get(key);
              if (col === '4') n.cst = tmInt(r.val);
              else if (col === '5') n._c = r;
              else if (col === '6') n.pst = tmInt(r.val);
              else if (col === '7') n._p = r;
              else if (col === '8') n.pd = r.val;
              else if (col === '9') n.sys = r.val;
              else if (col === '10') n.sd = r.val.split('\n')[0].substring(0, 48);
              else if (col === '12') {
                  var b = tmBytes(r), c = '', bits = b.length ? b[0] : 0;
                  if (bits & 0x20) c += 'B';
                  if (bits & 0x10) c += 'W';
                  if (bits & 0x08) c += 'R';
                  if (bits & 0x04) c += 'T';
                  if (bits & 0x01) c += 'S';
                  n.cap = c;
              }
