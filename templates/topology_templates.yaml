          var list = [];
          for (key in nb) {
              if (!nb.hasOwnProperty(key)) continue;
              n = nb[key];
              if (n._c) n.cid = tmLldpId(n._c, n.cst, 'c');
              if (n._p) n.pid = tmLldpId(n._p, n.pst, 'p');
              delete n._c; delete n._p;
              if (!n.cid && !n.sys) continue;
              list.push(n);
          }
          list.sort(function (x, y) { return tmNumSort(x.lp, y.lp) || ((x.cid || '') < (y.cid || '') ? -1 : 1); });
          return JSON.stringify(list);
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - '{$TOPO.HEARTBEAT}'
      master_item:
        key: topo.lldp.remote.walk
      tags:
      - tag: component
        value: topology
      trends: '0'
    - uuid: 487e34fb5b614e3ea2a218d58f377fa2
      name: 'LLDP: Infrastructure neighbors'
      type: DEPENDENT
      key: topo.lldp.infra
      delay: '0'
      history: '{$TOPO.HISTORY}'
      value_type: TEXT
      description: Bridge/router/AP neighbors only (phones and stations removed). Drives the change trigger.
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          // Infrastructure-only neighbor fingerprint: drops phones and stations so reboots
          // of desk gear do not fire the change trigger.
          var l = JSON.parse(value), o = [], i, n;
          for (i = 0; i < l.length; i++) {
              n = l[i];
              if (n.cap && (n.cap.indexOf('T') !== -1 || !/[BRW]/.test(n.cap))) continue;
              o.push(n.lp + ' ' + (n.sys || n.cid || '?') + ' ' + (n.pid || n.pd || ''));
          }
          return o.sort().join('\n');
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - '{$TOPO.HEARTBEAT}'
      master_item:
        key: topo.lldp.neighbors
      tags:
      - tag: component
        value: topology
      trends: '0'
      triggers:
      - uuid: 596eb555e1f94ebab9e416918f3a8abc
        expression: change(/Topology by SNMP/topo.lldp.infra)=1
        name: 'LLDP: Infrastructure neighbors changed on {HOST.NAME}'
        priority: INFO
        recovery_mode: NONE
        manual_close: 'YES'
        description: 'A switch, router or AP neighbor appeared, disappeared or moved ports. Compare the last two values of "LLDP: Infrastructure neighbors" or open Monitoring > Topology > Changes. Close manually.'
        tags:
        - tag: scope
          value: notice
        - tag: component
          value: topology
    - uuid: 67cca1a8e6004d5b9a5502c1620fef59
      name: 'Interfaces: Name walk'
      type: SNMP_AGENT
      snmp_oid: 'walk[1.3.6.1.2.1.31.1.1.1.1,1.3.6.1.2.1.2.2.1.2,1.3.6.1.2.1.31.1.1.1.18]'
      key: topo.ifnames.walk
      delay: '{$TOPO.IFNAMES.INTERVAL}'
      history: '0'
      value_type: TEXT
      trends: '0'
      description: 'ifName (ifDescr fallback) and ifAlias, so the module can label ports without depending on interface LLD. Near-static, so the parsed value is rarely stored. Not stored itself.'
      tags:
