      description: 'History for the edge-port MAC list. Endpoint churn changes it often, so keep this short.'
    - macro: '{$TOPO.FDB.EDGE.MAX}'
      value: '8'
      description: Ports with more MACs than this are treated as uplinks and stored as a count only.
