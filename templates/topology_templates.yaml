              else if ((s = tmSuffix(r.oid, DESCR)) !== null) get(s).d = r.val;
              else if ((s = tmSuffix(r.oid, ALIAS)) !== null) get(s).a = r.val;
          }
          var k = tmKeys(p).sort(tmNumSort), out = {}, x;
          for (i = 0; i < k.length; i++) {
              x = p[k[i]];
