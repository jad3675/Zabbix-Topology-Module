    - macro: '{$TOPO.FDB.INTERVAL}'
      value: 4h
      description: 'Forwarding table poll interval. This is the only walk whose size grows with the network, so it runs rarely. Shorten it on switches where you want endpoint moves noticed sooner.'
    - macro: '{$TOPO.FDB.OID}'
      value: 1.3.6.1.2.1.17.7.1.2.2.1.2
      description: FDB port column. Default Q-BRIDGE dot1qTpFdbPort. Set to 1.3.6.1.2.1.17.4.3.1.2 (dot1dTpFdbPort) on devices without Q-BRIDGE.
    - macro: '{$TOPO.FDB.HISTORY}'
