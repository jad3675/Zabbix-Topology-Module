              var n = parseInt(v, 10);
              return isNaN(n) ? def : n;
          }
          function tmKeys(o) { var k = []; for (var x in o) if (o.hasOwnProperty(x)) k.push(x); return k; }
          function tmNumSort(a, b) { return (parseInt(a, 10) - parseInt(b, 10)) || (a < b ? -1 : a > b ? 1 : 0); }
