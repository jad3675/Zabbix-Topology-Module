          var out = {e: {}, u: {}, t: total}, k = tmKeys(ports).sort(tmNumSort);
          for (i = 0; i < k.length; i++) {
              if (ports[k[i]].length > EDGE_MAX) out.u[k[i]] = ports[k[i]].length;
              else out.e[k[i]] = ports[k[i]].sort();
          }
          var json = JSON.stringify(out);
          if (json.length > MAX_BYTES) {
              // Size guard: demote the busiest edge ports to counts until it fits.
              var ek = tmKeys(out.e).sort(function (a, c) { return out.e[c].length - out.e[a].length; });
              var est = json.length;
              for (i = 0; i < ek.length && est > MAX_BYTES; i++) {
                  est -= out.e[ek[i]].length * 15;
                  out.u[ek[i]] = out.e[ek[i]].length;
                  delete out.e[ek[i]];
              }
              out.x = 1;
              json = JSON.stringify(out);
          }
          return json;
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - '{$TOPO.HEARTBEAT}'
      master_item:
        key: topo.fdb.walk
      tags:
      - tag: component
        value: topology
      trends: '0'
    tags:
    - tag: class
      value: network
    - tag: target
      value: topology
    macros:
    - macro: '{$TOPO.HEARTBEAT}'
      value: 12h
      description: 'Unchanged topology values are stored at most this often. Keep it below Administration > General > GUI > "Max history display period" or the map loses data.'
    - macro: '{$TOPO.HISTORY}'
      value: 14d
      description: History retention for topology text items. Only changes plus heartbeats are stored.
    - macro: '{$TOPO.WALK.TIMEOUT}'
